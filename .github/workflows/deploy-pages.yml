# Build the Astro site in wiki/ and publish wiki/dist to GitHub Pages.
#
# One-time setup (repository admin): Settings → Pages → Build and deployment
# → Source: GitHub Actions.
#
# The live URL is https://pietruszka.github.io/kb-wiki/. Astro `base` is
# /kb-wiki, so the artifact root is the site root and the URL has no /wiki/
# segment. Publishing the repository root would add that segment and would
# also publish README.md, design/, and later root files.

name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs below set their own permissions. Unspecified scopes are none.
permissions:
  contents: read

# One publish at a time on main. Pull request checks use their own group so
# they are not queued behind a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Typecheck and build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        working-directory: wiki
        run: npm ci

      - name: Typecheck
        working-directory: wiki
        run: npm run typecheck

      - name: Test
        working-directory: wiki
        run: npm test

      - name: Build
        working-directory: wiki
        run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy
    permissions:
      contents: read
      # upload-pages-artifact uses actions/upload-artifact. With explicit
      # permissions, artifact upload needs actions: write.
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        working-directory: wiki
        run: npm ci

      - name: Build
        working-directory: wiki
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: wiki/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
