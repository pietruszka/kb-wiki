# Build the Astro site in wiki/ and publish wiki/dist to GitHub Pages.
#
# One-time setup (repository admin): Settings → Pages → Build and deployment
# → Source: GitHub Actions.
#
# The live URL is https://pietruszka.github.io/kb-wiki/. Astro `base` is
# /kb-wiki, so the artifact root is the site root and the URL has no /wiki/
# segment. Publishing the repository root would add that segment and would
# also publish README.md, design/, raw/, and the agent files.
#
# `verify` typechecks, tests, and builds on pull requests and pushes. It
# does not upload. The build fails on bad frontmatter, a broken wikilink,
# an orphan page, index drift, or a malformed log entry. On a push to main
# or a manual run, `build` (after verify) produces one Pages artifact and
# `deploy` publishes it. `build` and `deploy` stay separate jobs:
# deploy-pages only sees artifacts from completed jobs, so
# an upload in the same job is reported as "Found 0 artifact(s)". A re-run
# of that combined job adds another artifact named github-pages. Upload
# once, in `build`.

name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# `verify` inherits contents: read. Jobs that publish set their own
# permissions. Unspecified scopes are none.
permissions:
  contents: read

# One publish at a time on main. Pull request checks use their own group so
# they are not queued behind a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Typecheck and build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        working-directory: wiki
        run: npm ci

      - name: Typecheck
        working-directory: wiki
        run: npm run typecheck

      - name: Test
        working-directory: wiki
        run: npm test

      - name: Build
        working-directory: wiki
        run: npm run build

  build:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Build Pages artifact
    permissions:
      contents: read
      # upload-pages-artifact uses actions/upload-artifact. With explicit
      # permissions, artifact upload needs actions: write.
      actions: write
      # configure-pages reads the Pages site (repos.getPages). It does not
      # enable the site.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        working-directory: wiki
        run: npm ci

      - name: Build
        working-directory: wiki
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: wiki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
